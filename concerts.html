<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Концерты — Татьяна Куртукова</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        :root {
            --primary: #d4af37;
            --bg-dark: #080808;
            --card-bg: #121212;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background: #111111;
            border-bottom: 1px solid var(--primary);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active { color: var(--primary); }

        .container { max-width: 850px; margin: 40px auto; padding: 0 20px; }

        h1 { color: var(--primary); text-align: center; font-size: 2rem; margin-bottom: 30px; }

        .concert-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: all 0.3s;
        }

        .concert-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.25);
        }

        .concert-date { color: var(--primary); font-size: 1.2rem; font-weight: bold; }
        .concert-city { font-size: 1.4rem; font-weight: bold; margin: 5px 0; }

        .btn-ticket {
            background: linear-gradient(45deg, #d4af37, #aa820a);
            color: #000;
            padding: 10px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Главная</a>
        <a href="concerts.html" class="active">Концерты</a>
        <a href="about.html">О Татьяне</a>
    </nav>

    <div class="container">
        <h1 data-aos="fade-down">Афиша и График Концертов</h1>

        <!-- حفلة ياروسلافل -->
        <div class="concert-card" data-aos="fade-up">
            <div>
                <div class="concert-date">📅 8 октября 2026 | 19:00</div>
                <div class="concert-city">Ярославль</div>
                <div style="color: #aaa;">КЗЦ «Миллениум»</div>
            </div>
            <a href="#" class="btn-ticket">Купить билет</a>
        </div>

        <!-- حفلة إيفانوفو -->
        <div class="concert-card" data-aos="fade-up" data-aos-delay="100">
            <div>
                <div class="concert-date">📅 9 октября 2026 | 19:00</div>
                <div class="concert-city">Иваново</div>
                <div style="color: #aaa;">Музыкальный театр</div>
            </div>
            <a href="#" class="btn-ticket">Купить билет</a>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>AOS.init({ duration: 900, once: true });</script>
</body>
</html>
