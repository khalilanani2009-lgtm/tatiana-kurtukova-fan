<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Татьяна Куртукова — Главная</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        :root {
            --primary: #d4af37;
            --primary-glow: rgba(212, 175, 55, 0.5);
            --bg-dark: #080808;
            --card-bg: #121212;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        nav {
            background: #111111;
            border-bottom: 1px solid var(--primary);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
            background: radial-gradient(circle at center, rgba(212,175,55,0.18) 0%, rgba(8,8,8,1) 80%);
        }

        .avatar-glow {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-glow);
            animation: pulse 2.8s infinite alternate ease-in-out;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .avatar-glow:hover {
            transform: scale(1.08) rotate(1deg);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.9);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
            100% { transform: scale(1.06); box-shadow: 0 0 40px rgba(212, 175, 55, 0.8); }
        }

        h1 { color: var(--primary); margin: 15px 0 5px; font-size: 2.3rem; letter-spacing: 1px; }
        .subtitle { color: #aaa; font-size: 1rem; margin-bottom: 10px; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .section-title { color: var(--primary); font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        .timer-display { font-size: 1.8rem; font-weight: bold; color: #fff; letter-spacing: 2px; }

        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            filter: invert(0.9) hue-rotate(180deg);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .social-btn {
            background: #1a1a1a;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">Главная</a>
        <a href="concerts.html">Концерты</a>
        <a href="about.html">О Татьяне</a>
    </nav>

    <header data-aos="fade-down">
        <img class="avatar-glow" src="https://static.tildacdn.com/tild3662-3863-4433-a339-333534666563/IMG_4562.JPG" alt="Татьяна Куртукова">
        <h1>Татьяна Куртукова</h1>
        <div class="subtitle">Фан-сообщество</div>
    </header>

    <div class="container">
        <!-- العداد التنازلي -->
        <div class="card" data-aos="fade-up">
            <div class="section-title">⏳ До сольного концерта в Ярославле (8 октября):</div>
            <div class="timer-display" id="timer">Загрузка...</div>
        </div>

        <!-- مشغل الموسيقى -->
        <div class="card" data-aos="fade-up" data-aos-delay="100">
            <div class="section-title">🎶 Главный хит «Матушка»</div>
            <p style="color: #ccc; font-size: 0.95rem;">Нажмите кнопку воспроизведения для прослушивания:</p>
            <audio controls preload="metadata">
                <source src="https://cdns-preview-d.dzcdn.net/stream/c-d830b8058db3ea5e982ca0e6f77242d5-3.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает аудиоплеер.
            </audio>
        </div>

        <!-- أزرار وسائل التواصل الاجتماعي المباشرة -->
        <div class="card" data-aos="fade-up" data-aos-delay="200">
            <div class="section-title">🌐 Наши социальные сети</div>
            <p style="color: #ddd; font-size: 0.95rem;">Подписывайтесь на наши фан-страницы:</p>
            <div class="social-links">
                <a href="https://www.instagram.com/tatyana.kurtukova.fan/?hl=ar" target="_blank" class="social-btn">📸 Instagram</a>
                <a href="https://www.tiktok.com/@tatyana._.kurtukova?lang=ar" target="_blank" class="social-btn">🎵 TikTok</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 900, once: true });

        var countDownDate = new Date("Oct 8, 2026 19:00:00").getTime();
        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("timer").innerHTML = days + "д " + hours + "ч " + minutes + "м " + seconds + "с";
        }, 1000);
    </script>
</body>
</html>
