<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Татьяна Куртукова — Независимый фан-сайт</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        :root {
            --primary: #d4af37;
            --bg-dark: #080808;
            --card-bg: #121212;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* شريط التنقل العلوي بين الصفحات */
        nav {
            background: #111111;
            border-bottom: 1px solid var(--primary);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(8,8,8,1) 80%);
        }

        .avatar-glow {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            animation: pulse 3s infinite alternate;
            object-fit: cover;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        h1 { color: var(--primary); margin: 15px 0 5px; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }

        .section-title { color: var(--primary); font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .timer-display { font-size: 1.6rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <!-- القائمة العلوية للتنقل بين الصفحات -->
    <nav>
        <a href="index.html" class="active">Главная (الرئيسية)</a>
        <a href="concerts.html">Концерты (الحفلات)</a>
        <a href="about.html">О Татьяне (عن تاتيانا)</a>
    </nav>

    <header data-aos="fade-down">
        <img class="avatar-glow" src="https://avatars.mds.yandex.net/get-kinopoisk-image/10809116/8277be5b-c2e7-40ab-b7b5-fbfeefd5ca44/280x420" alt="Татьяна Куртукова">
        <h1>Татьяна Куртукова</h1>
        <p style="color: #aaa;">Независимый фан-сайт</p>
    </header>

    <div class="container">
        <!-- العداد التنازلي -->
        <div class="card" data-aos="fade-up">
            <div class="section-title">⏳ До сольного концерта в Ярославле (8 октября):</div>
            <div class="timer-display" id="timer">Загрузка...</div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 900, once: true });
        var countDownDate = new Date("Oct 8, 2026 19:00:00").getTime();
        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("timer").innerHTML = days + "д " + hours + "ч " + minutes + "м " + seconds + "с";
        }, 1000);
    </script>
</body>
</html>
