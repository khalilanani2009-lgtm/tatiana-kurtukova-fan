<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Татьяна Куртукова — Главная</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
        :root {
            --primary: #d4af37;
            --bg-dark: #080808;
            --card-bg: #121212;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* شريط التنقل العلوي */
        nav {
            background: #111111;
            border-bottom: 1px solid var(--primary);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(8,8,8,1) 80%);
        }

        /* صورة حية وتفاعلية تتنفس وتتوهج */
        .avatar-glow {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
            animation: pulse 2.5s infinite alternate;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .avatar-glow:hover {
            transform: scale(1.08);
            box-shadow: 0 0 45px rgba(212, 175, 55, 0.9);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 35px rgba(212, 175, 55, 0.8); }
        }

        h1 { color: var(--primary); margin: 15px 0 5px; font-size: 2.2rem; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .section-title { color: var(--primary); font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        .timer-display { font-size: 1.8rem; font-weight: bold; color: #fff; }

        /* مشغل الصوت */
        audio {
            width: 100%;
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">Главная</a>
        <a href="concerts.html">Концерты</a>
        <a href="about.html">О Татьяне</a>
    </nav>

    <header data-aos="fade-down">
        <!-- صورة تاتيانا الحقيقية والمتحركة -->
        <img class="avatar-glow" src="https://static.tildacdn.com/tild3662-3863-4433-a339-333534666563/IMG_4562.JPG" alt="Татьяна Куртукова">
        <h1>Татьяна Куртукова</h1>
        <p style="color: #aaa;">Официальное фан-сообщество</p>
    </header>

    <div class="container">
        <!-- العداد التنازلي -->
        <div class="card" data-aos="fade-up">
            <div class="section-title">⏳ До сольного концерта в Ярославле (8 октября):</div>
            <div class="timer-display" id="timer">Загрузка...</div>
        </div>

        <!-- مشغل الموسيقى -->
        <div class="card" data-aos="fade-up" data-aos-delay="100">
            <div class="section-title">🎶 Музыкальный Плеер</div>
            <p style="color: #ccc; font-size: 0.95rem;">Слушайте главный хит «Матушка» прямо на сайте:</p>
            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает аудиоплеер.
            </audio>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 900, once: true });
        var countDownDate = new Date("Oct 8, 2026 19:00:00").getTime();
        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("timer").innerHTML = days + "д " + hours + "ч " + minutes + "м " + seconds + "с";
        }, 1000);
    </script>
</body>
</html>
