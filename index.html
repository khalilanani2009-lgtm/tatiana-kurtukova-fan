<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Татьяна Куртукова — Сообщество фанатов</title>
    <!-- استيراد خطوط ومكتبات التنسيق -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-secondary: #a0a5b0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, #1f242d, var(--bg-color));
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }
        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #121418;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button.btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button.btn:hover {
            background-color: #ff0b16;
        }
        #fans-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        #fans-list li {
            background: #121418;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #fans-list li span.fan-location {
            color: var(--accent-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Татьяна Куртукова</h1>
        <p>Официальное сообщество поклонников и география фанатов</p>
    </header>

    <div class="container">
        <!-- قسم إضافة الاسم والمكان -->
        <div class="card">
            <h2>Добавить себя на карту фанатов (انضم إلى خريطة المعجبين)</h2>
            <form id="fan-form">
                <div class="form-group">
                    <label for="fan-name">Имя (الاسم أو اللقب):</label>
                    <input type="text" id="fan-name" required placeholder="مثال: اليكسي أو اسمك المستعار">
                </div>
                <div class="form-group">
                    <label for="fan-city">Город / Страна (المدينة والدولة):</label>
                    <input type="text" id="fan-city" required placeholder="مثال: موسكو، روسيا">
                </div>
                <button type="submit" class="btn" id="submit-btn">Отправить (إرسال)</button>
            </form>
        </div>

        <!-- قسم عرض قائمة المعجَبين الحية -->
        <div class="card">
            <h2>География фанатов в реальном времени</h2>
            <ul id="fans-list">
                <li style="text-align: center; color: var(--text-secondary);">Загрузка данных... (جاري التحميل...)</li>
            </ul>
        </div>
    </div>

    <!-- سكربتات Firebase وربط قاعدة البيانات (Firestore) -->
    <script type="module">
        // استيراد مكتبات Firebase المطلوبة
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addTimestamp, addDoc, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // إعدادات الربط المستخرجة من حسابك في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDsv5tGG6eDjFu2kDfyrP-B_YAhNLzX_oo",
            authDomain: "tatyana-fans.firebaseapp.com",
            projectId: "tatyana-fans",
            storageBucket: "tatyana-fans.firebasestorage.app",
            messagingSenderId: "311266053549",
            appId: "1:311266053549:web:8414655fa00babf9796824"
        };

        // تهيئة Firebase و Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('fan-form');
        const fansList = document.getElementById('fans-list');

        // استقبال البيانات عند الضغط على زر الإرسال
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('fan-name').value.trim();
            const cityInput = document.getElementById('fan-city').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (!nameInput || !cityInput) return;

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Отправка...';

                // حفظ البيانات في مجموعة "fans" داخل قاعدة البيانات السحابية
                await addDoc(collection(db, "fans"), {
                    name: nameInput,
                    city: cityInput,
                    createdAt: new Date()
                });

                form.reset();
            } catch (error) {
                console.error("خطأ أثناء الإرسال: ", error);
                alert("حدث خطأ أثناء حفظ البيانات، يرجى المحاولة مرة أخرى.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить (إرسال)';
            }
        });

        // الاستماع للتحديثات الحية الفورية (Real-time sync) وعرضها على الموقع
        const q = query(collection(db, "fans"));
        onSnapshot(q, (snapshot) => {
            fansList.innerHTML = "";
            if (snapshot.empty) {
                fansList.innerHTML = `<li style="text-align: center; color: var(--text-secondary);">Пока нет записей. Станьте первым! (لا توجد تسجيلات بعد، كن الأول!)</li>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.innerHTML = `
                    <span><strong>${escapeHtml(data.name)}</strong></span>
                    <span class="fan-location">📍 ${escapeHtml(data.city)}</span>
                `;
                fansList.appendChild(li);
            });
        });

        // دالة أمان بسيطة لمنع حقن النصوص
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
