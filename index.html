<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Татьяна Куртукова — Главная</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #d4af37;
            --primary-glow: rgba(212, 175, 55, 0.5);
            --bg-dark: #080808;
            --card-bg: #121212;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* شريط التنقل العلوي مع الأيقونات */
        nav {
            background: #111111;
            border-bottom: 1px solid var(--primary);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
        }

        /* أيقونات إنستغرام وتيك توك الصغيرة في الأعلى */
        .header-socials {
            display: flex;
            gap: 12px;
        }

        .social-icon-btn {
            color: #ffffff;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon-btn:hover {
            background: var(--primary);
            color: #000000;
            box-shadow: 0 0 10px var(--primary);
            transform: scale(1.1);
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            background: radial-gradient(circle at center, rgba(212,175,55,0.18) 0%, rgba(8,8,8,1) 80%);
        }

        .avatar-glow {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-glow);
            animation: pulse 2.8s infinite alternate ease-in-out;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .avatar-glow:hover {
            transform: scale(1.08) rotate(1deg);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.9);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
            100% { transform: scale(1.06); box-shadow: 0 0 40px rgba(212, 175, 55, 0.8); }
        }

        h1 { color: var(--primary); margin: 15px 0 5px; font-size: 2.2rem; letter-spacing: 1px; }
        .subtitle { color: #aaa; font-size: 1rem; margin-bottom: 10px; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .section-title { color: var(--primary); font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        .timer-display { font-size: 1.8rem; font-weight: bold; color: #fff; letter-spacing: 2px; }

        /* مشغل الصوت */
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="index.html" class="active">Главная</a>
            <a href="concerts.html">Концерты</a>
            <a href="about.html">О Татьяне</a>
        </div>
        
        <!-- أيقونات السوشيال ميديا في أعلى الصفحة -->
        <div class="header-socials">
            <a href="https://www.instagram.com/tatyana.kurtukova.fan/?hl=ar" target="_blank" class="social-icon-btn" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/@tatyana._.kurtukova?lang=ar" target="_blank" class="social-icon-btn" title="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
        </div>
    </nav>

    <header data-aos="fade-down">
        <img class="avatar-glow" src="https://static.tildacdn.com/tild3662-3863-4433-a339-333534666563/IMG_4562.JPG" alt="Татьяна Куртукова">
        <h1>Татьяна Куртукова</h1>
        <div class="subtitle">Фан-сообщество</div>
    </header>

    <div class="container">
        <!-- العداد التنازلي -->
        <div class="card" data-aos="fade-up">
            <div class="section-title">⏳ До сольного концерта в Ярославле (8 октября):</div>
            <div class="timer-display" id="timer">Загрузка...</div>
        </div>

        <!-- مشغل الأغنية الشغال -->
        <div class="card" data-aos="fade-up" data-aos-delay="100">
            <div class="section-title">🎶 Главный хит «Матушка»</div>
            <p style="color: #ccc; font-size: 0.95rem;">Слушайте трек прямо на сайте:</p>
            <audio controls preload="auto">
                <source src="https://mp3zen.net/files/songs/Tatiana_Kurtukova_-_Matushka.mp3" type="audio/mpeg">
                <source src="https://zvuk.top/dl/song/38159" type="audio/mpeg">
                Ваш браузер не поддерживает аудиоплеер.
            </audio>
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 900, once: true });

        var countDownDate = new Date("Oct 8, 2026 19:00:00").getTime();
        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById("timer").innerHTML = days + "д " + hours + "ч " + minutes + "м " + seconds + "с";
        }, 1000);
    </script>
</body>
</html>
